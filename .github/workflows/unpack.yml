name: unpack
on:
  push:
    paths: ['edtech-crm-sales-analytics.zip', '.github/workflows/unpack.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project archive
        run: |
          if [ -f edtech-crm-sales-analytics.zip ]; then
            unzip -o -q edtech-crm-sales-analytics.zip -d /tmp/u
            cp -r /tmp/u/edtech-crm-sales-analytics/. .
            git rm -q edtech-crm-sales-analytics.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Распаковка проекта"
            git push
          fi
